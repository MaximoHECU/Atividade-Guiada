    <!-- ====================================================================

    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p class="subtitulo">Preencha os dados abaixo. Eles serão salvos no seu navegador.</p>

        <form id="formCadastro">
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="text" id="email" required>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" min="1" max="120" required>
            </div>

            <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso">
                    <option value="">--Selecione--</option>
                    <option>Sistemas de Informação</option>
                    <option>Engenharia de Software</option>
                    <option>Ciência da Computação</option>
                    <option>Análise e Desenvolvimento</option>
                </select>
            </div>

            <div class="campo">
                <label for="bio">Biografia</label>
                <textarea id="bio" rows="4" required></textarea>
            </div>

            <div class="botoes">
                <button type="button" id="btnSalvar">Salvar</button>
                <button type="button" id="btnLimpar" class="perigo">Limpar</button>
            </div>
        </form>

        <div id="mensagem"></div>
        <div id="dadosSalvos"></div>
    </div>
